local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0 # 局部地图更新频率5hz
      publish_frequency: 5.0 # 发布频率
      global_frame: odom # 局部地图坐标系
      robot_base_frame: base_link # 机器人本体坐标系
      use_sim_time: False
      rolling_window: true # 局部地图那个矩形框是否跟着机器人姿态旋转
      width: 6 # 局部地图大小
      height: 6
      resolution: 0.1 # 分辨率
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      # robot_radius: 0.30 # 机器人半径，这个会更小相比于全局地图的来说
      # plugins: ["voxel_layer", "inflation_layer"]
      plugins: ["obstacle_layer", "collision_obs", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      collision_obs:
        plugin: "nav2_costmap_2d::CollisionLayer"
        enabled: True
        topic: "/costmap_trigger"
        frame_id: "base_link"
        front_offset: 0.9
        size_x: 0.05
        size_y: 0.6
        leave_distance: 1.5 
      inflation_layer: # 膨胀层
        plugin: "nav2_costmap_2d::InflationLayer" # 膨胀层插件
        cost_scaling_factor: 3.0 # 膨胀层权重分布的因子
        inflation_radius: 0.32 # 膨胀半径

      obstacle_layer:  # 障碍物层
        plugin: "nav2_costmap_2d::ObstacleLayer" # 障碍物层插件
        enabled: True
        max_obstacle_intensity: 2.0
        min_obstacle_intensity: 0.2
        observation_sources: lidar
        lidar: # 激光传感器数据的一些详细配置
          topic: /lio_sam/mapping/cloud_registered_raw # 传感器话题
          max_obstacle_height: 1.0 # 障碍物最大的观测高度
          clearing: True # 障碍物观测数据是否用于射线清除，一般为true(动态障碍物)
          marking: True # 是否将观测到的数据标记为障碍物
          data_type: "PointCloud2" # 数据类型，nav2实现的障碍物层只能接收LaserScan和PointCloud2类型的数据
          raytrace_max_range: 5.0 # 射线清除的最大距离
          raytrace_min_range: 0.0 # 射线清除的最小距离
          obstacle_max_range: 4.8 # 障碍物标记的最大距离
          obstacle_min_range: 0.0 # 障碍物标记的最小距离

      # voxel_layer: # 体素层，和障碍物层类似，主要是用于三维障碍物的检测
        # plugin: "nav2_costmap_2d::VoxelLayer"
        # obstacle_lifetime: 1.0
        # enabled: True
        # publish_voxel_map: True 
        # origin_z: 0.0 # z轴的原点，0默认z轴原点在机器人平面上
        # z_resolution: 0.05 # z轴方向体素分辨率
        # z_voxels: 16 # z轴上体素的个数
        # max_obstacle_height: 2.0 # 最大障碍物高度
        # mark_threshold: 0 # 标记为障碍物的体素个数阈值(0表示该z轴体素上只要有一个体素有障碍物，此点上有障碍物
        # observation_sources: scan camera_left camera_right # 障碍物观测数据来源
        # observation_sources: camera_left camera_right # 障碍物观测数据来源
        # observation_sources: scan # 障碍物观测数据来源
        # scan:
          # topic: /laser/data
          # max_obstacle_height: 2.0
          # clearing: True
          # marking: True
          # data_type: "LaserScan"
          # raytrace_max_range: 3.0
          # raytrace_min_range: 0.0
          # obstacle_max_range: 2.5
          # obstacle_min_range: 0.0
        # camera_left:
          # topic: /low_obs_left
          # topic: /camera_left/depth/points
          # max_obstacle_height: 0.5
          # min_obstacle_height: 0.06
          # obstacle_max_range: 1.8
          # obstacle_min_range: 0.20
          # raytrace_max_range: 2.0
          # raytrace_min_range: 0.20
          # clearing: True
          # marking: True
          # data_type: "PointCloud2"
        # camera_right:
          # topic: /low_obs_right
          # topic: /camera_right/depth/points
          # max_obstacle_height: 0.5
          # min_obstacle_height: 0.06
          # obstacle_max_range: 1.8
          # obstacle_min_range: 0.20
          # raytrace_max_range: 2.0
          # raytrace_min_range: 0.20
          # clearing: True
          # marking: True
          # data_type: "PointCloud2"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0  # 全局地图更新的频率
      publish_frequency: 1.0 # 发布频率，一般用于rviz显示
      global_frame: map      # 全局地图坐标系名称
      robot_base_frame: base_link # 机器人本体坐标系名称
      use_sim_time: False # 是否使用仿真时间，在真机时设为false
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      # robot_radius: 0.30 # 机器人半径
      resolution: 0.1 # 地图分辨率，一般和slam建的图保持一致
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "collision_obs", "inflation_layer"] # 插件，采用了哪些地图层
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:  # 障碍物层
        plugin: "nav2_costmap_2d::ObstacleLayer" # 障碍物层插件
        enabled: True
        max_obstacle_intensity: 2.0
        min_obstacle_intensity: 0.2
        observation_sources: lidar
        lidar: # 激光传感器数据的一些详细配置
          topic: /lio_sam/mapping/cloud_registered_raw
          max_obstacle_height: 1.0 # 障碍物最大的观测高度
          clearing: True # 障碍物观测数据是否用于射线清除，一般为true(动态障碍物)
          marking: True # 是否将观测到的数据标记为障碍物
          data_type: "PointCloud2" # 数据类型，nav2实现的障碍物层只能接收LaserScan和PointCloud2类型的数据
          raytrace_max_range: 5.0 # 射线清除的最大距离
          raytrace_min_range: 0.0 # 射线清除的最小距离
          obstacle_max_range: 4.8 # 障碍物标记的最大距离
          obstacle_min_range: 0.0 # 障碍物标记的最小距离

      static_layer: # 静态地图层
        plugin: "nav2_costmap_2d::StaticLayer" # 静态地图层插件
        map_subscribe_transient_local: True
      collision_obs:
        plugin: "nav2_costmap_2d::CollisionLayer"
        enabled: True
        topic: "/costmap_trigger"
        frame_id: "base_link"
        front_offset: 0.9
        size_x: 0.05
        size_y: 0.6
        leave_distance: 1.5 
      inflation_layer: # 膨胀层，它的实现是直接操纵在静态地图层上的，没有独立地图层
        plugin: "nav2_costmap_2d::InflationLayer" # 膨胀层插件
        cost_scaling_factor: 3.0 # 膨胀因子，控制膨胀层权重衰减因子
        inflation_radius: 0.32 # 膨胀层半径
      always_send_full_costmap: True # 是否发送整张地图

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

filter_mask_server:
  ros__parameters:
    use_sim_time: False
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: "/home/ubuntu/2Dslam/src/nav2_bringup/maps/noimu_mask.yaml"


map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.49
    occupied_thresh_default: 0.55
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0 # 期望的规划器频率，路径计算有耗时，所以是期望达到的频率
    use_sim_time: False
    planner_plugins: ["GridBased"] # 要加载的规划器id，后续动作请求具体使用哪个规划器
    costmap_update_timeout: 1.0
    service_introspection_mode: "disabled"
    GridBased: # 对应上面规划器id，下面为此规划器内的一些参数设置
      plugin: "nav2_navfn_planner/NavfnPlanner" # 此id规划器具体指代的规划器插件
      tolerance: 0.1 # 公差
      use_astar: false
      allow_unknown: True
      cost_factor: 3.0              # 增加对高代价区域的敏感性
      lethal_cost: 140 
    # GridBased:
      # plugin: "nav2_smac_planner/SmacPlanner2D"
      # allow_unknown: true
      # use_astar: true
      # motion_model_for_search: "Dubin"  # or "Lattice"
      # angle_quantization_bins: 72
      # downsample_costmap: false
      # minimum_turning_radius: 0.2
      # allow_reverse: true
      # collision_checker:
        # footprint: 0.3
        # footprint_padding: 0.01

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait", "collision_back"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      acceleration_limit: 0.5
      deceleration_limit: -0.5
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      acceleration_limit: 0.5
      deceleration_limit: -0.5
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    collision_back:
      plugin: "nav2_behaviors/CollisionBack"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 1.8]
    min_velocity: [-0.26, 0.0, -1.8]
    max_accel: [1.5, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2